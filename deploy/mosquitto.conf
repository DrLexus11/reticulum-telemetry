# Mosquitto for the telemetry stack. Host network, bound to loopback only:
# no authentication, so nothing off this host may reach it.
listener 1883 127.0.0.1
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# Host-local additions, such as the bridge to the production broker
# (deploy/prod/connect-dev.sh). The directory is mounted by up.sh.
include_dir /mosquitto/config/conf.d
