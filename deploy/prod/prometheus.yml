# Production Prometheus: scrapes the backend over the compose network.
global:
  scrape_interval: 15s
# Ready for late reports (T2, not yet wired): the backend will write reports
# stored on the mesh through the remote-write receiver, with the time they
# were taken. Until then, every sample is the value at scrape time.
storage:
  tsdb:
    out_of_order_time_window: 48h
scrape_configs:
  - job_name: mesh-telemetry
    static_configs:
      - targets: ["backend:9101"]
